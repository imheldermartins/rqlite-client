name: rqlite-client
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - if: runner.os == 'Linux'
        run: docker compose -p rqlite-client-ci -f docker-compose.test.yml up -d
      - if: runner.os == 'Linux'
        run: npm test
        env:
          RUN_RQLITE_CLIENT_INTEGRATION: '1'
      - if: runner.os == 'Linux'
        run: npm run test:consumer
      - if: runner.os == 'Linux'
        run: node scripts/auth-consumer-smoke.mjs
      - if: always() && runner.os == 'Linux'
        run: docker compose -p rqlite-client-ci -f docker-compose.test.yml down
